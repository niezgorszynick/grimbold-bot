<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill challenge</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 13px/1.4 system-ui, sans-serif; color: #e6e6e6; background: transparent; }
    h2 { font-size: 15px; margin: 0; color: #f0d77a; }
    h3 { font-size: 12px; margin: 10px 0 4px; color: #a3a3a3; text-transform: uppercase; letter-spacing: .5px; }
    p { margin: 4px 0; }
    .muted { color: #a3a3a3; font-size: 12px; }
    .card { padding: 10px; border-radius: 8px; background: rgba(212, 175, 55, .08); border-left: 3px solid #d4af37; margin-bottom: 10px; }
    .situation { font-style: italic; }
    .tally { display: grid; gap: 2px; margin: 6px 0; }
    .pips { letter-spacing: 2px; font-size: 15px; }
    .ok, .pips.ok { color: #23a55a; }
    .bad, .pips.bad { color: #f23f43; }
    .help { color: #f0d77a; }
    .decided { padding: 4px 6px; border-radius: 4px; background: rgba(255, 255, 255, .06); }
    ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
    .order li { padding: 4px 6px; border-radius: 6px; }
    .order li.now { background: rgba(212, 175, 55, .18); }
    .init { display: inline-block; min-width: 24px; font-weight: bold; color: #a3a3a3; }
    .log li { padding: 2px 4px; }
    .log li.void { opacity: .5; text-decoration: line-through; }
    .turn { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
    select { padding: 4px; border-radius: 4px; border: 1px solid #555; background: #222; color: #eee; font: inherit; }
    button { padding: 5px 9px; border: 0; border-radius: 4px; background: #5865f2; color: #fff; cursor: pointer; font: inherit; }
    button.secondary { background: #4e5058; }
    button.tiny { padding: 1px 5px; font-size: 11px; margin-left: 4px; }
    .note { color: #f0d77a; font-size: 12px; }
  </style>
  <script type="module">
    import { FRAME_CSS } from '/vtt/frame.js';
    document.head.append(Object.assign(document.createElement('style'), { textContent: FRAME_CSS }));
  </script>
</head>
<body>
  <script type="module" src="/vtt/challenge.js"></script>
</body>
</html>
